<!doctype html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>دعوة زفاف بشير وبراق</title>
 <meta name="description" content="يسعدنا حضوركم ومشاركتنا فرحتنا — الثلاثاء 29 سبتمبر 2026، الساعة 8:30 مساءً، قاعة الحرير.">
 <meta name="theme-color" content="#f6eddd">
 <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='25' cy='32' r='17' fill='none' stroke='%23ad873d' stroke-width='5'/%3E%3Ccircle cx='40' cy='32' r='17' fill='none' stroke='%23ad873d' stroke-width='5'/%3E%3C/svg%3E">
 <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
 <main>
  <section id="welcome" class="welcome" aria-label="يسعدنا حضوركم ومشاركتنا فرحتنا">
   <div class="art cover">
    <img src="assets/cover.png" width="1280" height="800" alt="يسعدنا حضوركم ومشاركتنا فرحتنا، مع ورود بيضاء وزخارف ذهبية وعروسين يتبادلان الخواتم">
    <button id="enter" class="hotspot enter" aria-label="دخول الدعوة"><span class="sr-only">دخول الدعوة</span></button>
   </div>
  </section>
  <div id="invitation" hidden>
   <section class="art" aria-label="تفاصيل الدعوة">
    <img src="assets/invitation.png" width="1280" height="718" alt="بكل ما تحمله مشاعرنا من حب، ولأن فرحتنا تكتمل بمن نحب. يتشرف بشير وبراق بدعوتكم لحضور حفل زفافهما. الثلاثاء 29 / 9 / 2026، وقت الاستقبال 8:30 مساءً، قاعة الحرير.">
   </section>
   <section class="art location" aria-label="موقع الحفل">
    <img src="assets/location.png" width="1280" height="762" alt="موقع الحفل: قاعة الحرير. الإحداثيات 32°37′49.6″N 43°59′49.9″E. جنة الأطفال منازلهم.">
    <a class="hotspot map" href="https://www.google.com/maps/search/?api=1&query=32.630444,43.997194" target="_blank" rel="noopener noreferrer" aria-label="فتح موقع قاعة الحرير على خرائط Google"><span class="sr-only">فتح موقع الحفل</span></a>
   </section>
  </div>
 </main>
 <button id="music" class="music" hidden aria-pressed="false" aria-label="تشغيل الموسيقى">♫ <span>تشغيل الموسيقى</span></button>
 <script src="app.js?v=2"></script>
</body>
</html>
